<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Tunerfish</title>
  <defs>
    <radialGradient id="vinyl" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#151922"/>
    </radialGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f0a202"/>
    </linearGradient>
  </defs>

  <!-- Mirrored so the fish faces right -->
  <g transform="translate(0 46) scale(0.82)">
  <g transform="translate(256 0) scale(-1 1)">
  
    <!-- Tail: crescent, like a tuna's -->
    <path d="M176 128 C 190 118, 200 108, 214 84 C 224 66, 236 56, 246 52
             C 238 78, 228 104, 222 128 C 228 152, 238 178, 246 204
             C 236 200, 224 190, 214 172 C 200 148, 190 138, 176 128 Z"
          fill="url(#fin)"/>
  
    <!-- Narrow tail stalk joining body to tail -->
    <path d="M170 110 C 186 118, 198 124, 212 128 C 198 132, 186 138, 170 146 Z" fill="url(#fin)"/>
  
    <!-- Dorsal fin -->
    <path d="M86 62 C 98 40, 114 24, 132 14 C 132 32, 140 48, 152 62 Z" fill="url(#fin)"/>
    <!-- Belly fin -->
    <path d="M94 194 C 104 212, 116 226, 132 238 C 132 222, 138 208, 148 194 Z" fill="url(#fin)"/>
  
    <!-- Body: a vinyl record -->
    <circle cx="114" cy="128" r="78" fill="url(#vinyl)" stroke="#8a95ad" stroke-width="3"/>
    <g fill="none" stroke="#3b4356" stroke-width="2">
      <circle cx="114" cy="128" r="70"/>
      <circle cx="114" cy="128" r="62"/>
      <circle cx="114" cy="128" r="54"/>
      <circle cx="114" cy="128" r="46"/>
      <circle cx="114" cy="128" r="38"/>
    </g>
    <!-- Sheen across the grooves -->
    <path d="M60 86 A 66 66 0 0 1 120 62" fill="none" stroke="#ffffff" stroke-opacity="0.22"
          stroke-width="6" stroke-linecap="round"/>
  
    <!-- Record label and spindle hole -->
    <circle cx="114" cy="128" r="22" fill="url(#fin)"/>
    <circle cx="114" cy="128" r="3" fill="#151922"/>
  
    <!-- Gill line -->
    <path d="M84 88 C 72 110, 72 146, 84 168" fill="none" stroke="#5b657c" stroke-width="3" stroke-linecap="round"/>
  
    <!-- Eye -->
    <circle cx="60" cy="110" r="15" fill="#ffffff"/>
    <circle cx="56" cy="110" r="8" fill="#151922"/>
    <circle cx="53" cy="107" r="2.6" fill="#ffffff"/>
  </g>
  </g>

  <!-- Music-note bubbles rising from the mouth -->
  <g>
    <circle cx="200" cy="150" r="13" fill="#eaf5ff" stroke="#6fb3ea" stroke-width="2.5"/>
    <g fill="#1d2a44">
      <ellipse cx="198.2" cy="154.2" rx="3.9" ry="2.8" transform="rotate(-22 198.2 154.2)"/>
      <rect x="200.7" y="143.7" width="1.5" height="10.5"/>
      <path d="M201.5 143.7 C 206.3 145.2, 207.2 148.5, 204.8 151.2" fill="none" stroke="#1d2a44" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <circle cx="222" cy="108" r="16" fill="#eaf5ff" stroke="#6fb3ea" stroke-width="2.5"/>
    <g fill="#1d2a44">
      <ellipse cx="219.8" cy="113.2" rx="4.8" ry="3.5" transform="rotate(-22 219.8 113.2)"/>
      <rect x="222.9" y="100.3" width="1.8" height="12.9"/>
      <path d="M223.8 100.3 C 229.7 102.1, 230.8 106.2, 227.9 109.5" fill="none" stroke="#1d2a44" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    <circle cx="232" cy="56" r="20" fill="#eaf5ff" stroke="#6fb3ea" stroke-width="2.5"/>
    <g fill="#1d2a44">
      <ellipse cx="229.2" cy="62.4" rx="6.0" ry="4.4" transform="rotate(-22 229.2 62.4)"/>
      <rect x="233.2" y="46.3" width="2.3" height="16.1"/>
      <path d="M234.3 46.3 C 241.7 48.6, 243.0 53.7, 239.4 57.8" fill="none" stroke="#1d2a44" stroke-width="2.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
